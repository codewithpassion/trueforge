packages:
  - packages/*

minimumReleaseAge: 0
trustLockfile: true
confirmModulesPurge: false
allowBuilds:
  # Native codecs reached through @cloudflare/computer -> just-bash; the worker-shell backend
  # that uses them never runs, so their build scripts stay off.
  '@mongodb-js/zstd': false
  '@openuidev/lang-core': true
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  # Fern-generated SDK tests (packages/trueforge-sdk) run msw's postinstall.
  msw: true
  node-liblzma: false
  protobufjs: true
  # Local D1 store tests (@cloudflare/vitest-pool-workers) run on workerd.
  workerd: true

# Silence peer mismatches between trueforge-ui peers and the versions we pin.
peerDependencyRules:
  allowedVersions:
    '@truefoundry/assistant-ui-runtime': '0.1.34'

# One Context module for assistant-ui (avoids "requires an AuiProvider").
overrides:
  '@assistant-ui/store': '0.2.21'
  '@assistant-ui/core': '0.2.22'
  '@assistant-ui/react': '0.14.27'
  '@assistant-ui/tap': '0.9.5'
  zustand: '^5.0.14'
  # resolve@1.22.12 ships accidental .claude/ files that break installs under macOS sandbox.
  resolve: '1.22.11'
  # Rollup 4.63.0 OOMs the frontend Vite build (Monaco + compression plugin); stay on 4.62.x.
  rollup: '4.62.2'

patchedDependencies:
  # Adds the optional `integrationCatalog` and `computerCatalog` slots to `CatalogServer`, whose
  # slots are otherwise fixed, and `computerId` to `AgentSandboxConfig`. The patch is
  # workspace-local, and trueforge-ui's built .d.ts re-exports the new port
  # types by name, so DO NOT PUBLISH @truefoundry/trueforge-ui until the slots ship upstream and
  # this patch is dropped: an npm consumer on unpatched 0.1.37 fails to typecheck.
  '@truefoundry/assistant-ui-runtime@0.1.37': patches/@truefoundry__assistant-ui-runtime@0.1.37.patch
